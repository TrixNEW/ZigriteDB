name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src tests

      - name: Run Debug tests
        run: zig build test

      - name: Run ReleaseSafe tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Run ReleaseFast tests
        run: zig build test -Doptimize=ReleaseFast

      - name: Build and test native API (Debug)
        run: |
          zig build native-test
          python3 tests/native/native_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/native_smoke
          python3 tests/native/native_workloads.py zig-out/lib/libzigritedb_native.so

      - name: Build and test native API (ReleaseSafe)
        run: |
          zig build native-test -Doptimize=ReleaseSafe
          python3 tests/native/native_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/native_smoke
          python3 tests/native/native_workloads.py zig-out/lib/libzigritedb_native.so

      - name: Crash and fault-test Bedrock import and export
        run: |
          zig build -Doptimize=ReleaseSafe
          python3 tests/native/convert_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/zigrite 7

      - name: Smoke-test benchmark tooling
        run: |
          bash tests/bench/build.sh
          python3 tests/bench/smoke.py --binary "$HOME/.cache/zigritedb-pmmp-native/world" \
            --library zig-out/lib --library "$HOME/.cache/zigritedb-pmmp-native/build"

      - name: Build and test native API (ReleaseFast)
        run: |
          zig build native-test -Doptimize=ReleaseFast
          python3 tests/native/native_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/native_smoke --concurrency-only
          python3 tests/native/native_workloads.py zig-out/lib/libzigritedb_native.so

      - name: Run tests under ThreadSanitizer
        run: zig test --dep zigritedb -fsanitize-thread -Mroot=tests/root.zig -fsanitize-thread -Mzigritedb=src/root.zig

      - name: Fuzz parsers
        run: zig build fuzz --fuzz=10000
