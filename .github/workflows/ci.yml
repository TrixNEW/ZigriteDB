name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src tests

      - name: Run Debug tests
        run: zig build test

      - name: Run ReleaseSafe tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build and test native API (Debug)
        run: |
          zig build native-test
          python3 tests/native_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/native_smoke
          python3 tests/native_workloads.py zig-out/lib/libzigritedb_native.so

      - name: Build and test native API (ReleaseSafe)
        run: |
          zig build native-test -Doptimize=ReleaseSafe
          python3 tests/native_faults.py zig-out/lib/libzigritedb_native.so zig-out/bin/native_smoke
          python3 tests/native_workloads.py zig-out/lib/libzigritedb_native.so

      - name: Fuzz parsers
        run: zig build fuzz --fuzz=10000

      - name: Check benchmark workloads
        run: |
          zig build bench -Doptimize=ReleaseSafe
          python3 bench/run.py --batches 256 --repeats 1
